name: Build experimental TSOA 3D lobby (full APK)

on:
  workflow_dispatch:
  push:
    branches: [ experiment/lobby-3d ]

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build packages
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;24.0.8215888" \
            "cmake;3.22.1"

      - name: Prepare dedicated Box64 ELF
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zstd binutils
          python3 -m pip install --disable-pip-version-check --no-deps \
            --only-binary=:all: --require-hashes \
            --target "${RUNNER_TEMP}/tsoa-patchelf" \
            -r tools/patchelf-build-requirements.txt
          TSOA_PATCHELF="${RUNNER_TEMP}/tsoa-patchelf/bin/patchelf"
          "${TSOA_PATCHELF}" --version
          TSOA_TEST_PATCHELF="${TSOA_PATCHELF}" \
            python3 -m unittest discover -s tools/tests -p 'test_prepare_tsoa_box64.py' -v
          python3 tools/prepare_tsoa_box64.py --patchelf "${TSOA_PATCHELF}"
          python3 tools/prepare_tsoa_box64.py --check

      - name: Validate TSOA runtime helpers
        run: |
          curl --fail --location --retry 3 \
            https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar \
            --output "${RUNNER_TEMP}/tsoa-json.jar"
          python3 tools/tests/test_tsoa_runtime_config.py --json-jar "${RUNNER_TEMP}/tsoa-json.jar"
          python3 tools/tests/test_tsoa_box64_runtime.py --json-jar "${RUNNER_TEMP}/tsoa-json.jar"

      - name: Validate TSOA save backups
        run: python3 tools/tests/test_tsoa_save_archive.py

      - name: Validate TSOA rain audio
        run: |
          python3 tools/generate_tsoa_ambience.py --check
          python3 tools/tests/test_tsoa_pcm_loop.py

      - name: Validate TSOA game color modes
        run: python3 tools/tests/test_tsoa_game_color.py

      - name: Validate TSOA menu languages and spatial options
        run: |
          python3 tools/tests/test_tsoa_menu_language.py
          python3 tools/tests/test_tsoa_spatial_filters.py

      - name: Validate experimental native frame generation
        run: |
          python3 tools/tests/test_tsoa_frame_clock.py
          python3 tools/tests/test_tsoa_frame_interpolation.py
          python3 tools/tests/test_tsoa_frame_presenter.py
          python3 tools/tests/test_tsoa_frame_pacing.py

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TSOA-Lobby3D-Lab-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
